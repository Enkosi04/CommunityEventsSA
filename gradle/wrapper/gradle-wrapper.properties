# File: gradle-wrapper.properties
# Purpose: Tells Android Studio which version of Gradle to download and use
# to build the CommunityEventsSA app.
# Location: gradle/wrapper/gradle-wrapper.properties
# You should NOT edit this by hand unless your lecturer tells you to change the Gradle version.
# Android Studio updates this file automatically when you update Gradle.

# Date this file was last generated / updated by Android Studio
#Wed Aug 19 14:11:20 SAST 2026

# distributionBase: Where Gradle will be stored on your computer
# GRADLE_USER_HOME = usually C:\Users\YourName\.gradle on Windows
distributionBase=GRADLE_USER_HOME

# distributionPath: Sub-folder inside GRADLE_USER_HOME where Gradle is unpacked
# wrapper/dists = the standard folder for Gradle versions
distributionPath=wrapper/dists

# distributionSha256Sum: Security check - the fingerprint of the Gradle zip file
# Android Studio checks this to make sure the download was not corrupted or tampered with
# Do NOT change this unless you also change distributionUrl to a matching version
distributionSha256Sum=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806

# distributionUrl: The link Android Studio uses to download Gradle 9.1.0
# gradle-9.1.0-bin.zip = the "bin" version (smaller, only the files needed to build)
# The \: is an escape - it means the : is part of the URL, not a separator
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip

# networkTimeout: How long to wait (in milliseconds) when downloading Gradle
# 10000 = 10 seconds. If your internet is slow, the download may fail and you need to retry.
networkTimeout=10000

# validateDistributionUrl: If true, Android Studio checks that the URL is a real Gradle URL
# This protects you from fake / malicious Gradle downloads
validateDistributionUrl=true

# zipStoreBase: Where the downloaded .zip file is stored before it is unpacked
zipStoreBase=GRADLE_USER_HOME

# zipStorePath: Sub-folder for the stored zip file
zipStorePath=wrapper/dists
